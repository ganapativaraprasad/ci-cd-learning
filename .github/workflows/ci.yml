name: My First CI Pipeline

on:
  push:
    branches:
      - main

jobs:
  python-job:
    runs-on: ubuntu-latest

    steps:

      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Check Python Version
        run: python --version

      - name: Run Python Application
        run: python app.py